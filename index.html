<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Optical Sync</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jsQR for ultra-fast raw camera frame scanning -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <!-- QRCode generator engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

  <style>
    body {
      background-color: #050505;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    .active-tab {
      background-color: #262626;
      color: #ffffff;
      border-bottom: 2px solid #22c55e;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 antialiased">

  <!-- Header -->
  <header class="w-full max-w-md my-2 text-center">
    <h1 class="text-xl font-bold tracking-widest text-white uppercase">Fast Optical<span class="text-green-500">Sync</span></h1>
    <p class="text-[11px] text-gray-500 mt-0.5">High-Speed Air-Gapped Visual Transfer</p>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-xl p-4 shadow-2xl flex-1 flex flex-col justify-between">
    
    <!-- Tab Controls -->
    <div class="grid grid-cols-2 gap-1 bg-neutral-950 p-1 rounded-lg mb-4 text-xs font-semibold">
      <button id="btn-tab-send" onclick="switchTab('send')" class="py-2 rounded active-tab transition-all">Send</button>
      <button id="btn-tab-receive" onclick="switchTab('receive')" class="py-2 rounded text-gray-400 hover:text-white transition-all">Receive</button>
    </div>

    <!-- SEND TAB -->
    <section id="tab-send" class="flex-1 flex flex-col justify-between space-y-4">
      
      <!-- File Selector -->
      <div id="file-drop-zone" class="border border-dashed border-neutral-700 hover:border-green-500 rounded-lg p-4 text-center cursor-pointer relative bg-neutral-950/50 transition-colors">
        <input type="file" id="file-input" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" onchange="onFileSelected(event)">
        <p id="file-label" class="text-xs font-mono text-gray-300 truncate">Tap to select file</p>
        <p id="file-info" class="text-[10px] text-gray-500 mt-1">Ready for high-speed transmission</p>
      </div>

      <!-- Controls -->
      <div class="bg-neutral-950 p-3 rounded-lg border border-neutral-800 space-y-2 text-xs">
        <div class="flex justify-between items-center">
          <span class="text-gray-400">Target Speed:</span>
          <span id="fps-display" class="font-mono text-green-400 font-bold">30 FPS</span>
        </div>
        <input type="range" id="fps-slider" min="10" max="60" value="30" class="w-full accent-green-500 h-1 bg-neutral-800 rounded" oninput="updateFPS(this.value)">
        
        <div class="flex justify-between items-center text-[11px] text-gray-500 pt-1">
          <span>Chunk Size: <strong class="text-gray-300">900 Bytes</strong></span>
          <span>Total Chunks: <strong id="total-chunks-label" class="text-gray-300">0</strong></span>
        </div>
      </div>

      <!-- Start/Stop Button -->
      <button id="send-action-btn" onclick="toggleSending()" disabled class="w-full py-2.5 bg-neutral-800 text-gray-500 rounded-lg text-xs font-bold uppercase tracking-wider transition-all">
        Start Transfer
      </button>

      <!-- QR Display Canvas -->
      <div class="flex-1 min-h-[260px] bg-white rounded-lg p-2 flex items-center justify-center border border-neutral-800">
        <canvas id="qr-canvas" class="max-w-full max-h-[250px] object-contain"></canvas>
      </div>

      <!-- Stats -->
      <div class="flex justify-between items-center text-[11px] font-mono bg-neutral-950 px-3 py-2 rounded-lg border border-neutral-800 text-gray-400">
        <span>Frame: <strong id="sent-frame-count" class="text-white">0</strong></span>
        <span>Status: <strong id="send-status" class="text-yellow-500">Idle</strong></span>
      </div>

    </section>

    <!-- RECEIVE TAB -->
    <section id="tab-receive" class="flex-1 flex flex-col justify-between space-y-4 hidden">
      
      <!-- Video Viewport -->
      <div class="relative min-h-[260px] bg-neutral-950 rounded-lg overflow-hidden border border-neutral-800 flex items-center justify-center">
        <video id="video-preview" class="w-full h-full object-cover" playsinline></video>
        <canvas id="scan-canvas" class="hidden"></canvas>
        <div id="video-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-neutral-950 text-gray-500 text-xs p-4 text-center">
          <p>Camera inactive</p>
        </div>
      </div>

      <!-- Receiver Button -->
      <button id="rx-action-btn" onclick="toggleReceiving()" class="w-full py-2.5 bg-green-500 hover:bg-green-600 text-black font-bold rounded-lg text-xs uppercase tracking-wider transition-all">
        Start Camera
      </button>

      <!-- Progress Tracking -->
      <div class="bg-neutral-950 p-3 rounded-lg border border-neutral-800 space-y-2 text-xs">
        <div class="flex justify-between font-mono">
          <span class="text-gray-400">Progress:</span>
          <span id="rx-progress-text" class="text-green-400 font-bold">0% (0/0)</span>
        </div>
        <div class="w-full bg-neutral-800 h-2 rounded-full overflow-hidden">
          <div id="rx-progress-bar" class="bg-green-500 h-full w-0 transition-all duration-75"></div>
        </div>
        <div class="flex justify-between items-center text-[10px] text-gray-500 pt-1 font-mono">
          <span class="truncate max-w-[180px]">File: <span id="rx-file-name" class="text-gray-300">--</span></span>
          <span>Speed: <span id="rx-speed" class="text-green-400">0 KB/s</span></span>
        </div>
      </div>

    </section>

  </main>

  <footer class="w-full max-w-md text-center text-[10px] text-gray-600 my-2">
    Optical Sync &bull; High-Density QR Protocol
  </footer>

  <script>
    // State Constants & Variables
    const CHUNK_SIZE = 900; // ~900 bytes per frame for high throughput
    let targetFPS = 30;
    let selectedFile = null;
    let fileBuffer = null;
    let totalChunks = 0;
    
    // Transmission Variables
    let isSending = false;
    let currentChunkIdx = 0;
    let sendAnimationId = null;
    let lastFrameTime = 0;
    let qrEngine = null;

    // Receiver Variables
    let isReceiving = false;
    let mediaStream = null;
    let rxChunks = {};
    let rxTotalChunks = 0;
    let rxFileName = "";
    let rxStartTime = 0;
    let rxScanAnimationId = null;

    // Switch Tab
    function switchTab(tab) {
      const sendTab = document.getElementById('tab-send');
      const receiveTab = document.getElementById('tab-receive');
      const btnSend = document.getElementById('btn-tab-send');
      const btnReceive = document.getElementById('btn-tab-receive');

      if (tab === 'send') {
        sendTab.classList.remove('hidden');
        receiveTab.classList.add('hidden');
        btnSend.className = "py-2 rounded active-tab transition-all";
        btnReceive.className = "py-2 rounded text-gray-400 hover:text-white transition-all";
        if (isReceiving) stopReceiving();
      } else {
        receiveTab.classList.remove('hidden');
        sendTab.classList.add('hidden');
        btnReceive.className = "py-2 rounded active-tab transition-all";
        btnSend.className = "py-2 rounded text-gray-400 hover:text-white transition-all";
        if (isSending) stopSending();
      }
    }

    // Initialize QR Engine
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('qr-canvas');
      qrEngine = new QRious({
        element: canvas,
        size: 300,
        level: 'L' // Low error correction = higher data capacity per QR size
      });
    });

    function updateFPS(val) {
      targetFPS = parseInt(val, 10);
      document.getElementById('fps-display').innerText = `${targetFPS} FPS`;
    }

    // Handle File Selection
    async function onFileSelected(e) {
      const files = e.target.files;
      if (!files.length) return;

      selectedFile = files[0];
      document.getElementById('file-label').innerText = selectedFile.name;
      document.getElementById('file-info').innerText = `${(selectedFile.size / 1024).toFixed(1)} KB`;

      const arrayBuf = await selectedFile.arrayBuffer();
      fileBuffer = new Uint8Array(arrayBuf);
      totalChunks = Math.ceil(fileBuffer.length / CHUNK_SIZE);
      
      document.getElementById('total-chunks-label').innerText = totalChunks;

      const btn = document.getElementById('send-action-btn');
      btn.disabled = false;
      btn.className = "w-full py-2.5 bg-green-500 hover:bg-green-600 text-black font-bold rounded-lg text-xs uppercase tracking-wider transition-all cursor-pointer";
    }

    function toggleSending() {
      if (isSending) stopSending();
      else startSending();
    }

    function startSending() {
      if (!fileBuffer) return;
      isSending = true;
      currentChunkIdx = 0;
      lastFrameTime = performance.now();

      document.getElementById('send-status').innerText = "Transmitting";
      document.getElementById('send-status').className = "text-green-500 font-bold animate-pulse";

      const btn = document.getElementById('send-action-btn');
      btn.innerText = "Stop Transfer";
      btn.className = "w-full py-2.5 bg-red-500 hover:bg-red-600 text-white font-bold rounded-lg text-xs uppercase tracking-wider transition-all cursor-pointer";

      sendLoop(performance.now());
    }

    function stopSending() {
      isSending = false;
      if (sendAnimationId) cancelAnimationFrame(sendAnimationId);

      document.getElementById('send-status').innerText = "Stopped";
      document.getElementById('send-status').className = "text-yellow-500 font-bold";

      const btn = document.getElementById('send-action-btn');
      btn.innerText = "Start Transfer";
      btn.className = "w-full py-2.5 bg-green-500 hover:bg-green-600 text-black font-bold rounded-lg text-xs uppercase tracking-wider transition-all cursor-pointer";
    }

    // Ultra-Fast Canvas Render Loop
    function sendLoop(now) {
      if (!isSending) return;

      const interval = 1000 / targetFPS;
      const delta = now - lastFrameTime;

      if (delta >= interval) {
        lastFrameTime = now - (delta % interval);

        const chunkIdx = currentChunkIdx % totalChunks;
        const start = chunkIdx * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, fileBuffer.length);
        const chunk = fileBuffer.subarray(start, end);

        // Compact Protocol: chunkIdx/totalChunks|fileName|base64Data
        let binaryStr = '';
        for (let i = 0; i < chunk.length; i++) {
          binaryStr += String.fromCharCode(chunk[i]);
        }
        const payload = `${chunkIdx}/${totalChunks}|${selectedFile.name}|${btoa(binaryStr)}`;

        qrEngine.value = payload;

        currentChunkIdx++;
        document.getElementById('sent-frame-count').innerText = currentChunkIdx;
      }

      sendAnimationId = requestAnimationFrame(sendLoop);
    }

    // --- RECEIVER LOGIC ---
    function toggleReceiving() {
      if (isReceiving) stopReceiving();
      else startReceiving();
    }

    async function startReceiving() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        
        const video = document.getElementById('video-preview');
        video.srcObject = mediaStream;
        await video.play();

        document.getElementById('video-overlay').classList.add('hidden');
        isReceiving = true;
        rxChunks = {};
        rxTotalChunks = 0;
        rxStartTime = performance.now();

        const btn = document.getElementById('rx-action-btn');
        btn.innerText = "Stop Camera";
        btn.className = "w-full py-2.5 bg-red-500 hover:bg-red-600 text-white font-bold rounded-lg text-xs uppercase tracking-wider transition-all cursor-pointer";

        scanFrame();
      } catch (err) {
        alert("Camera error: " + err.message);
      }
    }

    function stopReceiving() {
      isReceiving = false;
      if (rxScanAnimationId) cancelAnimationFrame(rxScanAnimationId);

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }

      document.getElementById('video-overlay').classList.remove('hidden');
      const btn = document.getElementById('rx-action-btn');
      btn.innerText = "Start Camera";
      btn.className = "w-full py-2.5 bg-green-500 hover:bg-green-600 text-black font-bold rounded-lg text-xs uppercase tracking-wider transition-all cursor-pointer";
    }

    function scanFrame() {
      if (!isReceiving) return;

      const video = document.getElementById('video-preview');
      const canvas = document.getElementById('scan-canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height, {
          inversionAttempts: "dontInvert"
        });

        if (code && code.data) {
          processDecodedData(code.data);
        }
      }

      rxScanAnimationId = requestAnimationFrame(scanFrame);
    }

    function processDecodedData(data) {
      try {
        const pipeIdx = data.indexOf('|');
        if (pipeIdx === -1) return;

        const meta = data.substring(0, pipeIdx);
        const rest = data.substring(pipeIdx + 1);

        const secondPipe = rest.indexOf('|');
        if (secondPipe === -1) return;

        const fileName = rest.substring(0, secondPipe);
        const payloadBase64 = rest.substring(secondPipe + 1);

        const [chunkIdxStr, totalChunksStr] = meta.split('/');
        const chunkIdx = parseInt(chunkIdxStr, 10);
        rxTotalChunks = parseInt(totalChunksStr, 10);
        rxFileName = fileName;

        document.getElementById('rx-file-name').innerText = rxFileName;

        if (!rxChunks[chunkIdx]) {
          const binaryStr = atob(payloadBase64);
          const bytes = new Uint8Array(binaryStr.length);
          for (let i = 0; i < binaryStr.length; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
          }
          rxChunks[chunkIdx] = bytes;

          // Metrics Update
          const receivedCount = Object.keys(rxChunks).length;
          const percent = Math.round((receivedCount / rxTotalChunks) * 100);

          document.getElementById('rx-progress-bar').style.width = `${percent}%`;
          document.getElementById('rx-progress-text').innerText = `${percent}% (${receivedCount}/${rxTotalChunks})`;

          const elapsedSec = (performance.now() - rxStartTime) / 1000;
          let currentBytes = 0;
          Object.values(rxChunks).forEach(c => currentBytes += c.length);
          const speedKBps = (currentBytes / 1024 / elapsedSec).toFixed(1);
          document.getElementById('rx-speed').innerText = `${speedKBps} KB/s`;

          // Trigger Auto-Download on Complete
          if (receivedCount === rxTotalChunks) {
            stopReceiving();
            downloadFile();
          }
        }
      } catch (err) {
        console.error("Frame read fail", err);
      }
    }

    function downloadFile() {
      let totalLength = 0;
      for (let i = 0; i < rxTotalChunks; i++) {
        totalLength += rxChunks[i].length;
      }

      const fileBytes = new Uint8Array(totalLength);
      let offset = 0;
      for (let i = 0; i < rxTotalChunks; i++) {
        fileBytes.set(rxChunks[i], offset);
        offset += rxChunks[i].length;
      }

      const blob = new Blob([fileBytes]);
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = rxFileName;
      link.click();
    }
  </script>
</body>
</html>
